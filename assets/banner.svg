<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#141745"/>
    <stop offset="1" stop-color="#0B0D3B"/>
  </linearGradient>
</defs>
<rect width="1280" height="640" fill="url(#bg)"/>

<!-- терминальный лог слева -->
<g font-family="Consolas, Menlo, monospace" font-size="26" fill="#7A80C9">
  <text x="80" y="150">$ ds warm-lead-parser --run</text>
  <text x="80" y="200" fill="#5A5FA0">[00:01] fl.ru ............. 7 постов OK</text>
  <text x="80" y="245" fill="#5A5FA0">[00:02] kwork.ru .......... 12 брифов OK</text>
  <text x="80" y="290" fill="#5A5FA0">[00:04] avito (camoufox) .. 100 карточек OK</text>
  <text x="80" y="335" fill="#5A5FA0">[00:06] скоринг ........... 173 → 14 → 3</text>
  <text x="80" y="380" fill="#FFB224">[00:07] 🔥 тёплый лид найден — балл 75</text>
  <text x="80" y="430" fill="#3DDC84">[00:07] цена лида: 875₽ · окупаемость ×8 [OK]</text>
  <rect x="82" y="452" width="18" height="28" fill="#FFB224">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- заголовок справа -->
<g font-family="'IBM Plex Sans', Arial, sans-serif">
  <text x="700" y="270" font-size="64" font-weight="700" fill="#FFFFFF">Discovery</text>
  <text x="700" y="345" font-size="64" font-weight="700" fill="#FFB224">Warm Lead Parser</text>
  <text x="700" y="400" font-size="26" fill="#7A80C9">Находит клиентов в открытых источниках.</text>
  <text x="700" y="438" font-size="26" fill="#7A80C9">Скоринг 0-100 · экономика · ноль логинов.</text>
</g>

<!-- мини-радар справа сверху -->
<g transform="translate(1050,120) scale(0.55)">
  <g stroke="#3A3F7A" stroke-width="2" opacity="0.55" fill="none">
    <path d="M 96 240 A 144 144 0 0 1 240 96"/>
    <path d="M 60 240 A 180 180 0 0 1 240 60"/>
  </g>
  <circle cx="316" cy="164" r="9" fill="#FFB224"/>
  <circle cx="352" cy="240" r="7" fill="#FFB224" opacity="0.85"/>
  <rect x="228" y="228" width="24" height="24" fill="#FFB224"/>
</g>
</svg>